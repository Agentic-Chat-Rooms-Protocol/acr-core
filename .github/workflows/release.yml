name: GitHub Release & Platform Signing Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 1. Single-host cross-compilation matrix on Linux (CGO_ENABLED=0 pure Go)
  build-matrix:
    name: Cross-Compile Matrix (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Run Full Test Suite
        run: CGO_ENABLED=0 go test -v ./...

      - name: Run GoReleaser (Build Only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Binaries for Signing
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-binaries
          path: dist/acr-daemon_windows_*/*

      - name: Upload macOS Binaries for Notarization
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-binaries
          path: dist/acr-daemon_darwin_*/*

  # 2. Windows Signing on native Windows runner (Azure Trusted Signing or Self-Signed Fallback)
  sign-windows:
    name: Sign Windows Binaries
    needs: build-matrix
    runs-on: windows-latest
    steps:
      - name: Download Windows Binaries
        uses: actions/download-artifact@v4
        with:
          name: unsigned-windows-binaries
          path: windows-bin/

      # Path A: Modern Azure Trusted Signing (Cloud HSM)
      - name: Sign with Azure Trusted Signing
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: windows-bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      # Path B: Self-Signed PFX Fallback for Dev/Staging Pipelines
      - name: Sign with Self-Signed PFX Certificate
        if: env.AZURE_CLIENT_ID == '' && env.WINDOWS_CERT_BASE64 != ''
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          $certPath = "$env:TEMP\cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          
          Get-ChildItem -Path windows-bin -Filter *.exe -Recurse | ForEach-Object {
            Write-Host "Signing $($_.FullName) with self-signed certificate..."
            & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
          }
          Remove-Item -Path $certPath -Force

      - name: Upload Signed Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-binaries
          path: windows-bin/

  # 3. macOS Code Signing & Apple Notarization on native macOS runner
  sign-macos:
    name: Codesign & Notarize macOS Binaries
    needs: build-matrix
    runs-on: macos-latest
    steps:
      - name: Download macOS Binaries
        uses: actions/download-artifact@v4
        with:
          name: unsigned-macos-binaries
          path: macos-bin/

      - name: Codesign and Notarize with Apple
        if: env.APPLE_CERT_BASE64 != ''
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$APPLE_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          find macos-bin -type f -perm +111 | while read -r bin; do
            echo "Codesigning $bin..."
            codesign --force --options runtime --timestamp --sign "Developer ID Application" "$bin"
            
            # Zip and notarize
            zip -j "${bin}.zip" "$bin"
            xcrun notarytool submit "${bin}.zip" --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$bin" || echo "Stapling standalone binary skipped"
          done

      - name: Upload Signed macOS Binaries
        uses: actions/upload-artifact@v4
        with:
          name: signed-macos-binaries
          path: macos-bin/

  # 4. Final Release Assembly via GoReleaser
  publish:
    name: Publish GitHub Release
    needs: [build-matrix, sign-windows, sign-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Download Signed Artifacts
        uses: actions/download-artifact@v4
        with:
          path: signed-artifacts/

      - name: Run GoReleaser Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
